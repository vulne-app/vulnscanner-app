name: CI/CD Pipeline - Azure Deployment

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - dev

env:
  NODE_VERSION: "20.x"
  AZURE_WEBAPP_NAME: "vulnscanner-app" #  REMPLACE PAR TON NOM D'APP SERVICE AZURE
  AZURE_WEBAPP_PACKAGE_PATH: "."

jobs:
  # ========================================
  # JOB 1 : TESTS ET LINT
  # ========================================
  test:
    name: Run Tests and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Check for build errors
        run: |
          if [ $? -ne 0 ]; then
            echo "Build failed!"
            exit 1
          fi

  # ========================================
  # JOB 2 : DÉPLOIEMENT SUR AZURE
  # S'exécute uniquement sur push vers main
  # ========================================
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Create deployment package
        run: |
          mkdir -p deployment
          cp -r .next deployment/
          cp -r public deployment/ || true
          cp package*.json deployment/
          cp next.config.* deployment/ || true

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deployment success notification
        if: success()
        run: |
          echo "Deployment to Azure successful!"
          echo " App URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"

      - name: Deployment failure notification
        if: failure()
        run: |
          echo " Deployment to Azure failed!"
          exit 1
